include: package:very_good_analysis/analysis_options.yaml
analyzer:
  errors:
    # Deprecadas en el linter, pero siguen viniendo prendidas desde
    # very_good_analysis. Se ignoran desde acá porque nombrarlas en `linter:
    # rules:` dispara `deprecated_lint` y falla el análisis. Y no son gratis de
    # aplicar: sacar el `await` de un `return await` cambia que la excepción la
    # agarre el `try` de alrededor, que es la unsoundness por la que Dart
    # deprecó la regla.
    unnecessary_await_in_return: ignore
    one_member_abstracts: ignore
    discarded_futures: ignore
    comment_references: ignore
    invalid_annotation_target: ignore
  exclude:
    # `flutter pub get` agrega las siete solo, en cada corrida, y las repone si
    # alguien las borra. Sacarlas es pelearle a la herramienta para que las
    # vuelva a escribir en el siguiente `pub get`, así que se quedan.
    #
    # **Las de plataforma no matchean nada, tampoco ahora que existe
    # `example/`.** Están ancladas a la raíz, así que `example/android/**` no
    # cae en `android/**`. Lo que cubre las carpetas de plataforma del ejemplo
    # es su propio `example/analysis_options.yaml`, que las excluye relativas a
    # sí mismo. Y el `flutter analyze` de acá **sí** analiza `example/lib`:
    # verificado plantándole un `unused_import` y viéndolo reportado desde la
    # raíz.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
linter:
  rules:
    sort_constructors_first: true
    sort_pub_dependencies: false
    flutter_style_todos: false
    lines_longer_than_80_chars: false
    comment_references: false
